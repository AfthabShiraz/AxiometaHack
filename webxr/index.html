<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rover View — Axiometa</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #f4f7f2;
      background: #0b100e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #app {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, #1a3328, transparent 50%),
        #0b100e;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem; padding: 1.5rem; text-align: center;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }
    h1 {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      margin: 0;
      letter-spacing: 0.06em;
      font-weight: 800;
    }
    p { max-width: 28rem; color: #b7c4b8; line-height: 1.4; margin: 0; }
    #status {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.4rem 0.85rem;
      border: 1px solid #3a4f42;
      border-radius: 999px;
      color: #9fb8a6;
    }
    #status.ok { border-color: #5ce08a; color: #5ce08a; }
    #status.bad { border-color: #ff4d6d; color: #ff4d6d; }
    #enter, .mode-btn {
      appearance: none;
      border: none;
      background: #c8f542;
      color: #10160e;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 1.1rem 2rem;
      border-radius: 8px;
      cursor: pointer;
      min-width: min(90vw, 320px);
      box-shadow: 0 12px 40px rgba(200, 245, 66, 0.25);
    }
    #enter:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .step { display: flex; flex-direction: column; align-items: center; gap: 1rem; width: 100%; }
    .mode-btn { display: flex; flex-direction: column; gap: 0.3rem; align-items: center; }
    .mode-btn small {
      font-size: 0.78rem; font-weight: 500; letter-spacing: 0.02em;
      color: #33421c; text-transform: none;
    }
    .mode-btn.alt {
      background: transparent;
      color: #5ce08a;
      border: 2px solid #5ce08a;
      box-shadow: 0 12px 40px rgba(92, 224, 138, 0.15);
    }
    .mode-btn.alt small { color: #7e9084; }
    #mode-back {
      appearance: none; background: none; border: none; cursor: pointer;
      color: #7e9084; font: inherit; font-size: 0.85rem;
      text-decoration: underline; text-underline-offset: 3px;
    }
    #hub-row {
      display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;
      max-width: 420px; width: 100%;
    }
    #hub-input {
      flex: 1; min-width: 200px;
      padding: 0.7rem 0.85rem;
      border-radius: 6px;
      border: 1px solid #3a4f42;
      background: #142019;
      color: #f4f7f2;
      font: inherit;
    }
    .hint { font-size: 0.8rem; color: #7e9084; }
    #overlay-hud {
      position: absolute; left: 50%; top: 12%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      display: none;
      z-index: 2;
    }
    #overlay-hud .big {
      font-size: 1.4rem; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase;
      text-shadow: 0 2px 12px #000;
    }
    #overlay-hud .big.bad { color: #ff4d6d; }
    #overlay-hud .big.warn { color: #ffc857; }
    #overlay-hud .big.ok { color: #5ce08a; }
    #overlay-hud .sub {
      margin-top: 0.3rem;
      font-size: 0.85rem;
      color: #b7c4b8;
      text-shadow: 0 1px 8px #000;
    }
    #exit-btn {
      pointer-events: auto;
      margin-top: 0.6rem;
      appearance: none; cursor: pointer;
      background: rgba(8, 14, 12, 0.75);
      border: 1px solid #3a4f42;
      border-radius: 999px;
      color: #9fb8a6;
      font: inherit; font-size: 0.8rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.35rem 0.9rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="ui">
      <div id="step-connect" class="step">
        <div id="status" class="bad">HUB OFFLINE</div>
        <h1>ROVER VIEW</h1>
        <p>Passthrough + robot POV. One tap to enter. Hub URL is saved after the first setup.</p>
        <div id="hub-row">
          <input id="hub-input" type="url" placeholder="https://….trycloudflare.com or leave blank for same host" />
        </div>
        <button id="enter" disabled>Enter Rover View</button>
        <p class="hint">On Quest: open this page in Browser → tap Enter. Cast via Meta Horizon app for the second screen.</p>
      </div>
      <div id="step-mode" class="step" style="display: none;">
        <h1>SELECT MISSION</h1>
        <button id="mode-explore" class="mode-btn">
          Exploration Mode
          <small>First-person rover view · head-tracked camera</small>
        </button>
        <button id="mode-rescue" class="mode-btn alt">
          Rescue Mission
          <small>Draw a route · holographic terrain · find the victim</small>
        </button>
        <button id="mode-back">back to hub setup</button>
      </div>
    </div>
    <div id="overlay-hud">
      <div class="big" id="hud-msg"></div>
      <div class="sub" id="hud-sub"></div>
      <button id="exit-btn">&larr; menu</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
